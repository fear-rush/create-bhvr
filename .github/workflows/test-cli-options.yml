name: Generated projects

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  generated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [core-default, core-tailwind, core-shadcn, addons]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun scripts/verify-generated.ts ${{ matrix.group }}

  integrations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command: [test:auth, test:tools]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run ${{ matrix.command }}
